name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/gradle-build-action@v3
      - name: Copy app icon from main to res
        run: |
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          if [ -f app/src/main/ic_launcher.png ]; then cp app/src/main/ic_launcher.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png; fi
          if [ -f app/src/main/res/mipmap-xxxhdpi/ic_launcher.png ]; then echo "icon ok"; else echo "icon missing - using default"; fi
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
